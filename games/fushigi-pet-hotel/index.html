<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#7fd0ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ペットホテル">
  <meta name="description" content="ふしぎな いきものが とまりにくる ホテルで、おせわと へやの かざりつけを する ゲーム。">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>ふしぎな ペットホテル</title>
</head>
<body>
<main id="game">
  <canvas id="world" aria-label="ゲームがめん"></canvas>

  <header id="hud" hidden>
    <div class="hud-left">
      <div id="dayPill" class="pill">1にちめ</div>
      <button id="backBtn" class="chip">◀ もどる</button>
      <button id="decorBtn" class="chip deco">🎨 かざる</button>
    </div>
    <div id="heartPill" class="pill hearts"><span class="h">❤</span><b id="heartCount">0</b></div>
    <div class="hud-right">
      <button id="letterBtn" class="chip badge">💌 おてがみ</button>
      <button id="zukanBtn" class="chip">📖 ずかん</button>
      <button id="setBtn" class="chip icon" aria-label="せってい">⚙️</button>
    </div>
  </header>

  <div id="tools" hidden>
    <button class="tool" data-tool="food"><span>🍽️</span><small>ごはん</small></button>
    <button class="tool" data-tool="bath"><span>🫧</span><small>おふろ</small></button>
    <button class="tool" data-tool="pet"><span>🤲</span><small>なでる</small></button>
    <button class="tool" data-tool="play"><span>⚽</span><small>あそぶ</small></button>
    <button class="tool" data-tool="sleep"><span>🌙</span><small>ねんね</small></button>
  </div>

  <button id="sleepBtn" class="big sleep" hidden>🌙 おやすみ</button>

  <div id="drawer" hidden>
    <div class="dtabs">
      <button data-tab="item" class="on">🛏️<small>かぐ</small></button>
      <button data-tab="wall">🖼️<small>かべ</small></button>
      <button data-tab="floor">🟫<small>ゆか</small></button>
    </div>
    <div id="drawerItems"></div>
    <button id="decorDone" class="done">できた！</button>
  </div>

  <div id="toast" aria-live="polite"></div>

  <section id="title" class="screen">
    <div class="logo">
      <span class="sub">ぷにゅの</span>
      <h1>ふしぎな<br>ペットホテル</h1>
    </div>
    <button id="playBtn" class="big">あそぶ</button>
  </section>

  <section id="settings" class="screen shade" hidden>
    <div class="panel">
      <h2>せってい</h2>
      <button id="soundBtn" class="toggle"></button>
      <button id="resetBtn" class="small warn">さいしょから あそぶ</button>
      <button class="small back">もどる</button>
    </div>
  </section>

  <section id="zukan" class="screen shade" hidden>
    <div class="panel wide">
      <h2>おきゃくさん ずかん</h2>
      <div id="zukanCards" class="cards"></div>
      <p class="note">おせわを すると、すきなものが わかって くるよ。</p>
      <button class="small back">もどる</button>
    </div>
  </section>

  <section id="letters" class="screen shade" hidden>
    <div class="panel wide">
      <h2>💌 おてがみ</h2>
      <div id="letterList" class="minis"></div>
      <button class="small back">もどる</button>
    </div>
  </section>

  <section id="letterView" class="screen shade" hidden>
    <div class="panel letter-panel">
      <h2 class="yay" id="letterTitle">💌 おてがみが とどいたよ！</h2>
      <div id="letterBox"></div>
      <button id="letterNext" class="big">よんだ！</button>
    </div>
  </section>

  <div id="rotate"><div class="phone">📱</div><p>よこに してね</p></div>
  <div id="debug" hidden></div>
  <div id="loading">よみこみちゅう…</div>
  <div id="error" hidden><p>よみこめませんでした。</p><p id="errorDetail"></p><button onclick="location.reload()">もういちど</button></div>
</main>
<script type="module">
import('./app.mjs').catch(e => { document.getElementById('loading').hidden = true; document.getElementById('error').hidden = false; document.getElementById('errorDetail').textContent = e.message; });
</script>
</body>
</html>
