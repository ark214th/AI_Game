<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1d1426">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="おかたづけ">
  <meta name="description" content="いたずらオバケに じゃまされながら、ちらかった 本を 本だなに もどす おかたづけ ゲーム。">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>オバケやしきの おかたづけ</title>
</head>
<body>
<main id="game">
  <canvas id="world" aria-label="ゲームがめん"></canvas>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>オバケやしきの<br>おかたづけ</h1>
      <ul class="rules">
        <li><b>1</b><span>ゆかの 本を タッチすると、かごに 入るよ（5さつまで）</span></li>
        <li><b>2</b><span>おなじ 色の たなを タッチして、本を もどそう</span></li>
        <li><b>3</b><span>オバケが きたら、ゆびで おさえて ライトで てらそう！ たなに とどくと ちらかされちゃうよ</span></li>
      </ul>
      <button id="startBtn" type="button">はじめる</button>
    </div>
  </div>

  <div class="overlay" id="clearScreen" hidden>
    <div class="card">
      <h2>おかたづけ かんりょう！</h2>
      <p class="lead">いたずらオバケが こうさんして<br>なかまに なった！</p>
      <div class="stats" id="stats"></div>
      <button id="againBtn" type="button">もういちど</button>
      <p class="note">つぎの へやは じゅんびちゅう</p>
    </div>
  </div>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
