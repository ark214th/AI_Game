<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#7fd0ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ぷにゅ">
  <meta name="description" content="まるくてかわいいぷにゅと、ほしのかけらを集める横スクロールアクション。">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>ぷにゅの きらきらランド</title>
</head>
<body>
<main id="game">
  <canvas id="world" aria-label="ゲーム画面"></canvas>

  <header id="hud" hidden>
    <div class="hud-left">
      <div id="hearts" class="pill" aria-label="ハート"></div>
      <div class="pill"><span class="star-icon">★</span><b id="starCount">0</b></div>
    </div>
    <div id="medals" class="pill medals" aria-label="メダル"><i></i><i></i><i></i></div>
    <button id="pauseBtn" class="round" aria-label="ひとやすみ">❚❚</button>
  </header>
  <div id="bossBar" hidden><span class="boss-label">ボス</span><span id="bossHearts"></span></div>
  <div id="callout" aria-live="polite"></div>

  <div id="touch" hidden>
    <div class="pad left">
      <div class="btn" id="btnLeft" aria-hidden="true">◀</div>
      <div class="btn" id="btnRight" aria-hidden="true">▶</div>
    </div>
    <div class="pad right">
      <div class="btn jump" id="btnJump" aria-hidden="true">ぴょん</div>
    </div>
  </div>

  <section id="title" class="screen">
    <div class="logo">
      <span class="sub">ぷにゅの</span>
      <h1>きらきら<br>ランド</h1>
    </div>
    <div class="title-actions">
      <button id="playBtn" class="big">あそぶ</button>
      <div class="row">
        <button id="dressBtn" class="small badge">👗 きせかえ</button>
        <button id="bookBtn" class="small badge">📒 シールちょう</button>
        <button id="settingsBtn" class="small">せってい</button>
      </div>
    </div>
    
  </section>

  <section id="select" class="screen shade" hidden>
    <div class="panel wide">
      <div id="worldTabs" class="wtabs"></div>
      <h2 id="worldName">おはなの のはら</h2>
      <div id="stageList" class="stages"></div>
      <div class="select-foot"><button class="small back">もどる</button><span class="medal-total"><i class="on"></i> <b id="medalTotal">0</b></span></div>
    </div>
  </section>

  <section id="settings" class="screen shade" hidden>
    <div class="panel">
      <h2>せってい</h2>
      <button id="autoBtn" class="toggle"></button>
      <p class="note">オンにすると ぷにゅが じぶんで あるくよ。<br>「ぴょん」だけで あそべるよ。</p>
      <button id="soundBtn" class="toggle"></button>
      <button class="small back">もどる</button>
    </div>
  </section>

  <section id="pause" class="screen shade" hidden>
    <div class="panel">
      <h2>ひとやすみ</h2>
      <button id="resumeBtn" class="big">つづける</button>
      <button id="retryBtn" class="small">はじめから</button>
      <button id="quitBtn" class="small">おわる</button>
    </div>
  </section>

  <section id="result" class="screen shade" hidden>
    <div class="panel">
      <h2 class="yay" id="resultTitle">クリア！</h2>
      <div id="resultMedals" class="medals big-medals"><i></i><i></i><i></i></div>
      <p class="result-stars"><span class="star-icon">★</span> <b id="resultStars">0</b></p>
      <div id="resultNew" class="new-line" hidden></div>
      <p id="resultDebug" class="debug-line" hidden></p>
      <button id="nextBtn" class="big">つぎへ</button>
      <div class="row"><button id="againBtn" class="small">もういちど</button><button id="selectBtn" class="small">えらぶ</button><button id="homeBtn" class="small">タイトル</button></div>
    </div>
  </section>

  <section id="dress" class="screen" hidden>
    <div class="panel dress-panel">
      <h2>きせかえ</h2>
      <div id="dressTabs" class="dtabs"></div>
      <div id="dressItems" class="ditems"></div>
      <button class="small back">もどる</button>
    </div>
  </section>

  <section id="book" class="screen shade" hidden>
    <div class="panel wide book-panel">
      <h2>シールちょう <span id="stickerCount" class="sticker-count"></span></h2>
      <div id="stickerGrid" class="sticker-grid"></div>
      <p id="stickerInfo" class="sticker-info"></p>
      <button class="small back">もどる</button>
    </div>
  </section>

  <section id="ending" class="screen" hidden>
    <div class="ending-sky"></div>
    <div class="panel ending-panel">
      <h2 class="yay">ほしぞらが もどったよ！</h2>
      <p class="ending-text">いたずらかぜも なかよしになって、<br>きらきらランドに ほしが ぜんぶ もどったよ。<br>ぷにゅ、ありがとう！</p>
      <div id="endingNew" class="new-line"></div>
      <p class="result-stars">🌟 おしまい 🌟</p>
      <button id="endingBtn" class="big">タイトルへ</button>
    </div>
  </section>

  <div id="rotate"><div class="phone">📱</div><p>よこに してね</p></div>
  <div id="debug" hidden></div>
  <div id="loading">よみこみちゅう…</div>
  <div id="error" hidden><p>よみこめませんでした。</p><p id="errorDetail"></p><button onclick="location.reload()">もういちど</button></div>
</main>
<script type="module">
import('./app.mjs').catch(e => { document.getElementById('loading').hidden = true; document.getElementById('error').hidden = false; document.getElementById('errorDetail').textContent = e.message; });
</script>
</body>
</html>
