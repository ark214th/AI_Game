<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffd6e4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ぷにゅの がっこう">
  <meta name="description" content="ぷにゅが がっこうに かよう 1しゅうかんを すごす ゲーム。きんようびは ダンス はっぴょうかい。">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ぷにゅの がっこう</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ffe9f1;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
    }
    #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
      background: #ffe9f1; color: #5a3d55; font: 900 26px "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif; text-align: center; z-index: 5; }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="world" aria-label="ゲームがめん"></canvas>
  <div id="rotate"><div style="font-size:64px">📱↻</div>よこに して あそんでね</div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
