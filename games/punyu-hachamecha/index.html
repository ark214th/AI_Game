<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffc9e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ぷにゅ">
  <meta name="description" content="ぷにゅが 3Dの しまを あるいて、ともだちを たすける ゲーム。">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>ぷにゅと はちゃめちゃ おたすけ だいぼうけん</title>
</head>
<body>
<main id="game">
  <canvas id="world" aria-label="ゲームがめん"></canvas>
  <div class="sky-clouds" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

  <header id="hud" hidden>
    <div class="hud-left">
      <div class="pill" aria-label="えがお">😊 <b id="smileCount">0</b></div>
      <div class="pill" aria-label="かけら">✦ <b id="shardCount">0</b></div>
      <div class="pill" id="missionPill" hidden></div>
    </div>
    <div class="hud-right">
      <button id="bookBtn2" class="round" aria-label="シールちょう">📒</button>
      <button id="soundBtn" class="round" aria-label="おと">🔊</button>
    </div>
  </header>
  <div id="callout" aria-live="polite"></div>

  <div id="touch" hidden aria-hidden="true">
    <div id="stick"><div id="knob"></div></div>
    <div class="btn action" id="btnAction">！</div>
  </div>

  <section id="title" class="screen">
    <div class="logo">
      <span class="sub">ぷにゅと</span>
      <h1>はちゃめちゃ<br>おたすけ だいぼうけん</h1>
    </div>
    <div class="title-actions">
      <button id="playBtn" class="big">あそぶ</button>
      <div class="row">
        <button id="bookBtn" class="small">📒 シールちょう</button>
        <button id="letterBtn" class="small">💌 おてがみ</button>
      </div>
    </div>
  </section>

  <section id="book" class="screen shade" hidden>
    <div class="panel">
      <h2 id="bookTitle">シールちょう</h2>
      <div class="tabs">
        <button class="tab on" data-tab="sticker">シール</button>
        <button class="tab" data-tab="letter">おてがみ</button>
        <button class="tab" data-tab="find">はっけん</button>
      </div>
      <div id="bookBody" class="book-body"></div>
      <button id="bookClose" class="big small-big">とじる</button>
    </div>
  </section>

  <section id="janken" class="screen dock" hidden>
    <div class="panel janken-panel">
      <button id="jankenQuit" class="quit" aria-label="やめる">✕</button>
      <div class="janken-hands">
        <span class="who">🦀</span>
        <span id="oppHand" class="opp-hand">❓</span>
        <span id="jankenMsg" class="janken-msg">じゃんけん…</span>
        <span id="youHand" class="opp-hand">❓</span>
        <span class="who">🐹</span>
      </div>
      <div class="janken-btns">
        <button class="hand-btn" data-hand="gu">✊</button>
        <button class="hand-btn" data-hand="choki">✌️</button>
        <button class="hand-btn" data-hand="pa">✋</button>
      </div>
      <div id="jankenWins" class="janken-wins">☆ ☆ ☆</div>
    </div>
  </section>

  <section id="reward" class="screen shade" hidden>
    <div class="panel reward-panel">
      <div class="reward-emoji" id="rewardEmoji">🎉</div>
      <div class="reward-title">やったー！</div>
      <div id="rewardFlowers" class="flowers" aria-label="はなまる"></div>
      <div id="rewardItems" class="reward-items"></div>
      <div class="row">
        <button id="rewardAgain" class="small">🔁 もういちど</button>
        <button id="rewardClose" class="big small-big">つぎへ</button>
      </div>
    </div>
  </section>

  <div id="rotate">📱 よこに してね</div>
  <div id="debugBar" hidden><button id="resetBtn">ほぞんを けす</button></div>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
